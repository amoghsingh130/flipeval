[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flipeval"
version = "0.2.0"
description = "Paired behavioral-change statistics for compressed-model evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8", "pandas>=2.2", "pyyaml>=6"]

[project.scripts]
flipeval = "flipeval.cli:main"

[tool.setuptools.packages.find]
include = ["flipeval*", "pilot_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
