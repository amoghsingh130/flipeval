[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flipeval"
version = "0.3.0"
description = "Paired behavioral-change statistics for compressed-model evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8", "pandas>=2.2", "pyyaml>=6"]

[project.scripts]
flipeval = "flipeval.cli:main"

[tool.setuptools.packages.find]
include = ["flipeval*", "pilot_eval*"]

# The certification table ships inside the package so that `flipeval required-n`
# works from an installed distribution, where results/ is not present. It is a
# byte-identical copy of the released results/certification_tables_rev2.csv and
# tests/test_certification_lookup.py fails if the two ever differ.
[tool.setuptools.package-data]
flipeval = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
