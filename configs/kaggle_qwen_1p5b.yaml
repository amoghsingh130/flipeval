run_name: kaggle_qwen25_1p5b_pilot
output_dir: /kaggle/working/results
device_map: auto
batch_size: 1

baseline:
  name: fp16
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  dtype: float16
  trust_remote_code: true

methods:
  - name: gptq_s0
    model_id: /kaggle/working/outputs/quantized/qwen25-1p5b-gptq4-seed0
    dtype: float16
    seed: 0
    trust_remote_code: true
  - name: gptq_s1
    model_id: /kaggle/working/outputs/quantized/qwen25-1p5b-gptq4-seed1
    dtype: float16
    seed: 1
    trust_remote_code: true
  - name: gptq_s2
    model_id: /kaggle/working/outputs/quantized/qwen25-1p5b-gptq4-seed2
    dtype: float16
    seed: 2
    trust_remote_code: true
  - name: awq_s0
    model_id: /kaggle/working/outputs/quantized/qwen25-1p5b-awq4-seed0
    dtype: float16
    seed: 0
    trust_remote_code: true
  - name: awq_s1
    model_id: /kaggle/working/outputs/quantized/qwen25-1p5b-awq4-seed1
    dtype: float16
    seed: 1
    trust_remote_code: true
  - name: awq_s2
    model_id: /kaggle/working/outputs/quantized/qwen25-1p5b-awq4-seed2
    dtype: float16
    seed: 2
    trust_remote_code: true

tasks:
  - name: mmlu
    split: test
    subjects:
      - abstract_algebra
      - college_computer_science
      - high_school_statistics
      - machine_learning
