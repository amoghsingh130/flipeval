# H3 mini-grid: 4 of the 8 registered confirmatory cells.
#
# Scope and escalation rule: docs/MINIGRID_REGISTRATION_2026-07-15.md (FROZEN).
# Staged plan: docs/PACE_EXECUTION_PLAN_2026-07-15.md, Stages 5-7.
# Pinned identities: configs/main_grid_manifest.yaml (FROZEN).
#
# 2 models x {fp16, gptq seeds 0-4, awq seeds 0-4} = 22 variants,
# x {MMLU full test, GSM8K indices 0-999} = 44 evaluation JSONLs.
#
# This is a multi-model grid config. pilot_eval.run requires --model-tag to
# select one model; it never defaults, because silently picking the first model
# would evaluate the wrong weights into a correctly-named run directory.

schema_version: 1
grid: minigrid-h3
output_dir: results
device_map: auto
batch_size: 1

models:
  # --- Cell pair 1: Qwen2.5-1.5B-Instruct ---------------------------------
  - tag: qwen25-1p5b
    run_name: qwen25_1p5b_minigrid_h3
    baseline:
      name: fp16
      model_id: Qwen/Qwen2.5-1.5B-Instruct
      revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
      dtype: float16
      trust_remote_code: true
    # Every quantized variant names its backend explicitly. Framework kernel
    # auto-selection is the campaign's known hazard class: it fails at load
    # (missing optimum; absent Marlin runtime) or, worse, substitutes a kernel
    # silently -- and the kernel is a registered nuisance variable.
    # See docs/PACE_ENVIRONMENT_NOTE.md, cell-3 backend probes 11285100/11285139.
    methods:
      - {name: gptq_s0, model_id: outputs/quantized/qwen25-1p5b-gptq4-seed0, dtype: float16, seed: 0, quantization_backend: gptqmodel_torch}
      - {name: gptq_s1, model_id: outputs/quantized/qwen25-1p5b-gptq4-seed1, dtype: float16, seed: 1, quantization_backend: gptqmodel_torch}
      - {name: gptq_s2, model_id: outputs/quantized/qwen25-1p5b-gptq4-seed2, dtype: float16, seed: 2, quantization_backend: gptqmodel_torch}
      - {name: gptq_s3, model_id: outputs/quantized/qwen25-1p5b-gptq4-seed3, dtype: float16, seed: 3, quantization_backend: gptqmodel_torch}
      - {name: gptq_s4, model_id: outputs/quantized/qwen25-1p5b-gptq4-seed4, dtype: float16, seed: 4, quantization_backend: gptqmodel_torch}
      - {name: awq_s0, model_id: outputs/quantized/qwen25-1p5b-awq4-seed0, dtype: float16, seed: 0, quantization_backend: awq_gemm}
      - {name: awq_s1, model_id: outputs/quantized/qwen25-1p5b-awq4-seed1, dtype: float16, seed: 1, quantization_backend: awq_gemm}
      - {name: awq_s2, model_id: outputs/quantized/qwen25-1p5b-awq4-seed2, dtype: float16, seed: 2, quantization_backend: awq_gemm}
      - {name: awq_s3, model_id: outputs/quantized/qwen25-1p5b-awq4-seed3, dtype: float16, seed: 3, quantization_backend: awq_gemm}
      - {name: awq_s4, model_id: outputs/quantized/qwen25-1p5b-awq4-seed4, dtype: float16, seed: 4, quantization_backend: awq_gemm}

  # --- Cell pair 2: Llama-3.2-3B-Instruct ---------------------------------
  - tag: llama32-3b
    run_name: llama32_3b_minigrid_h3
    baseline:
      name: fp16
      model_id: meta-llama/Llama-3.2-3B-Instruct
      revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
      dtype: float16
      trust_remote_code: true
    methods:
      - {name: gptq_s0, model_id: outputs/quantized/llama32-3b-gptq4-seed0, dtype: float16, seed: 0, quantization_backend: gptqmodel_torch}
      - {name: gptq_s1, model_id: outputs/quantized/llama32-3b-gptq4-seed1, dtype: float16, seed: 1, quantization_backend: gptqmodel_torch}
      - {name: gptq_s2, model_id: outputs/quantized/llama32-3b-gptq4-seed2, dtype: float16, seed: 2, quantization_backend: gptqmodel_torch}
      - {name: gptq_s3, model_id: outputs/quantized/llama32-3b-gptq4-seed3, dtype: float16, seed: 3, quantization_backend: gptqmodel_torch}
      - {name: gptq_s4, model_id: outputs/quantized/llama32-3b-gptq4-seed4, dtype: float16, seed: 4, quantization_backend: gptqmodel_torch}
      - {name: awq_s0, model_id: outputs/quantized/llama32-3b-awq4-seed0, dtype: float16, seed: 0, quantization_backend: awq_gemm}
      - {name: awq_s1, model_id: outputs/quantized/llama32-3b-awq4-seed1, dtype: float16, seed: 1, quantization_backend: awq_gemm}
      - {name: awq_s2, model_id: outputs/quantized/llama32-3b-awq4-seed2, dtype: float16, seed: 2, quantization_backend: awq_gemm}
      - {name: awq_s3, model_id: outputs/quantized/llama32-3b-awq4-seed3, dtype: float16, seed: 3, quantization_backend: awq_gemm}
      - {name: awq_s4, model_id: outputs/quantized/llama32-3b-awq4-seed4, dtype: float16, seed: 4, quantization_backend: awq_gemm}

# Tasks are shared by both models, not declared per model: the registered parity
# requirement is that every variant of a model sees the identical item set, and
# one shared list makes divergence unrepresentable rather than merely detected.
tasks:
  # MMLU: full test split at the pinned revision -- 14,042 items across all 57
  # subjects (verified against the pinned revision in-image, job 11338439).
  # `limit` applies per subject in the loader, so it must stay null for "full".
  - name: mmlu
    split: test
    limit: null
    dataset_revision: c30699e8356da336a370243923dbaf21066bb9fe
    prompt_style: chat
    subjects:
      - abstract_algebra
      - anatomy
      - astronomy
      - business_ethics
      - clinical_knowledge
      - college_biology
