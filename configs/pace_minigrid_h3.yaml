  # GSM8K: test indices 0-999 in dataset order, at the pinned revision.
  #
  # `fewshot: 1` is a BOOLEAN switch, not a count. Any truthy value emits
  # pilot_eval.tasks.GSM8K_FEWSHOT, a fixed block of THREE worked examples
  # inline in the user message. The value 1 is kept so this prompt is
  # byte-identical to the validated bridge canary.
  # Governing text: docs/MINIGRID_REGISTRATION_2026-07-15.md, Amendment 2
  # (2026-07-21). Supporting finding: docs/GSM8K_FEWSHOT_FINDING_2026-07-21.md.
  - name: gsm8k
    split: test
    limit: 1000
    dataset_revision: 740312add88f781978c0658806c59bc2815b9866
    fewshot: 1
    fewshot_style: inline
    max_new_tokens: 256
    prompt_style: chat

# Operational acceptance criteria for scripts/verify_minigrid.py. These decide
# whether the grid is mechanically sound; they are not an H3 analysis, and no
# criterion here applies to a quantized variant's accuracy.
minigrid_acceptance:
  expected_jsonl_files: 44
  expected_item_counts: {mmlu: 14042, gsm8k: 1000}

  task_dataset_revisions:
    mmlu: c30699e8356da336a370243923dbaf21066bb9fe
    gsm8k: 740312add88f781978c0658806c59bc2815b9866

  # FP16 operational gates, per model and per task.
  #
  # DERIVED, NOT DECLARED. Filled from the trusted lm-eval 0.4.12 reference runs
  # (scripts/slurm/reference_run.sbatch) by the arithmetic frozen in
  # docs/MINIGRID_FP16_GATE_DERIVATION_2026-07-21.md section 3, and committed
  # before any quantized mini-grid result exists.
  #
  # The bridge's Qwen ranges are deliberately NOT reused: MMLU [0.365, 0.465]
  # was derived on the 400-item, 4-subject, hard-STEM-skewed bridge subset and
  # does not describe full MMLU test; GSM8K [0.55, 0.65] was a declared
  # expectation checked on 200 items, not 1,000.
  #
  # Derived 2026-07-21 from reference arrays 11338637 (MMLU) and 11342098
  # (GSM8K, rerun with inline exemplar placement). Term-by-term arithmetic and
  # run identities: docs/MINIGRID_FP16_GATE_RECORD_2026-07-21.md.
  #
  #   cell               n        p         half     gate
  #   qwen25 / mmlu   14042   0.582538     0.050    [0.532538, 0.632538]
  #   qwen25 / gsm8k   1000   0.575000     0.062    [0.513000, 0.637000]
  #   llama32 / mmlu  14042   0.580900     0.050    [0.530900, 0.630900]
  #   llama32 / gsm8k  1000   0.695000     0.060    [0.635000, 0.755000]
  #
  # Applied to FP16 baselines ONLY. No range here applies to any quantized
  # variant, and none may be constructed after quantized results are seen.
  baseline_accuracy_ranges:
    qwen25-1p5b:
      mmlu: [0.532538, 0.632538]
      gsm8k: [0.513, 0.637]
    llama32-3b:
      mmlu: [0.5309, 0.6309]
      gsm8k: [0.635, 0.755]

  calibration:
    dataset: allenai/c4
    dataset_config: en
    dataset_revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
    sample_count: 128
    sequence_length: 2048
    bits: 4
    paired_seeds: [0, 1, 2, 3, 4]
