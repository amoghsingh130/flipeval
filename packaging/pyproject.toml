[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flipeval-cli"
version = "0.1.0"
description = "Standalone CLI for paired equivalence and flip analysis over lm-eval --log_samples files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    # The registered analysis code. scipy is retained deliberately: this is the
    # standalone tool, not the numpy-and-stdlib-only upstream contribution.
    "flipeval>=0.2.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
# NOT `flipeval`: the root distribution already ships a `flipeval` console
# script bound to the registered `flipeval.cli:main`, which has its own
# `compare` subcommand. Claiming the same name would let whichever package was
# installed last silently shadow the other. See README, "Why not `flipeval`".
flipeval-compare = "flipeval_cli.main:main"

[tool.setuptools.packages.find]
include = ["flipeval_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
